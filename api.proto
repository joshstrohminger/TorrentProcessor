edition = "2023";

import "google/protobuf/duration.proto";

option go_package = "github.com/joshstrohminger/TorrentProcessor/internal/api";

service ControlService {
  rpc Refresh(RefreshRequest) returns (Empty);
}

message Empty {}

message RefreshRequest {
  Reason reason = 1;
  google.protobuf.Duration when = 2;

  enum Reason {
    Added = 0;
    Processing = 1;
    Processed = 2;
    Error = 3;
    Warning = 4;
  }
}
